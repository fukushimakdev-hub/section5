<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ページ全体を囲むラッパー -->
  <main class="wrapper">
    <!-- プロフィール（画像・名前・肩書き） -->
    <header>
      <img src="https://picsum.photos/800/600?random=1" alt="ランダム画像1">
      <h1>山田 太郎</h1>
      <p>Web デザイナー / フロントエンドエンジニア</p>
    </header>

    <!-- 自己紹介文 -->
    <section>
      <h2>自己紹介</h2>
      <p>はじめまして、山田太郎です。シンプルで使いやすい Web サイトづくりを心がけています。現在は HTML / CSS / JavaScript を中心に学んでいます。</p>
    </section>

    <!-- 趣味・スキル -->
    <section>
      <h2>趣味・スキル</h2>
      <ul>
        <li>HTML / CSS（SCSS）</li>
        <li>JavaScript</li>
        <li>カフェ巡り</li>
        <li>写真撮影</li>
      </ul>
    </section>

    <!-- 連絡先 -->
    <footer>
      <h2>連絡先</h2>
      <p><a href="mailto:example@example.com">example@example.com</a></p>
    </footer>
  </main>
</body>
</html>
